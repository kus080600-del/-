<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>365天存錢大挑戰</title>
    <style>
        :root {
            --pink: #FF6AD5; --yellow: #FFEA00; --cyan: #00E5FF;
            --purple: #9262FF; --green: #69FFB4; --dark: #2D3436; --bg: #FFF9FB;
        }
        * { box-sizing: border-box; font-family: 'PingFang TC', 'STHeiti', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); margin: 0; padding: 10px; display: flex; justify-content: center; }

        .app-container {
            background: white; width: 100%; max-width: 414px; min-height: 95vh;
            border: 5px solid var(--dark); border-radius: 40px; padding: 20px;
            box-shadow: 10px 10px 0px var(--pink); position: relative;
        }

        h1 { 
            text-align: center; font-size: 1.8rem; color: var(--purple); 
            text-shadow: 3px 3px 0px var(--yellow); margin: 10px 0;
        }

        .milestones { display: flex; justify-content: space-around; margin: 15px 0; background: #f0f0f0; padding: 10px; border-radius: 20px; border: 3px solid var(--dark); }
        .badge { font-size: 1.3rem; filter: grayscale(1); opacity: 0.2; transition: 0.3s; }
        .badge.active { filter: grayscale(0); opacity: 1; transform: scale(1.2); }

        .config-card { background: #fafafa; border: 3px solid var(--dark); border-radius: 20px; padding: 12px; margin-bottom: 15px; }
        .input-row { display: flex; align-items: center; margin: 5px 0; font-weight: bold; font-size: 0.9rem; }
        input { border: none; border-bottom: 2px dashed var(--pink); flex: 1; padding: 4px; font-size: 1rem; outline: none; background: transparent; }

        .progress-section { margin-bottom: 15px; }
        .stats { display: flex; justify-content: space-between; font-weight: bold; font-size: 0.85rem; margin-bottom: 5px; }
        .bar-container { height: 30px; background: #eee; border: 3px solid var(--dark); border-radius: 15px; overflow: hidden; position: relative; }
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--green), var(--yellow)); transition: 0.5s ease; }
        .percent-label { position: absolute; width: 100%; text-align: center; top: 4px; font-weight: 900; font-size: 1rem; }

        /* 核心格子區 - 確保有高度 */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 5px; 
            margin-bottom: 30px; 
            min-height: 200px;
        }
        .cell { 
            aspect-ratio: 1; background: white; border: 1.5px solid var(--dark); 
            border-radius: 6px; display: flex; align-items: center; justify-content: center; 
            font-size: 0.6rem; font-weight: bold; cursor: pointer; 
        }
        .cell.done { border: none; color: white; box-shadow: inset 2px 2px rgba(0,0,0,0.1); }

        .reset-container { text-align: center; margin-top: 20px; padding-bottom: 20px; }
        .btn-reset { background: #ff4757; color: white; border: 3px solid var(--dark); padding: 8px 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.8rem; box-shadow: 3px 3px 0px var(--dark); }

        /* 晃動動畫 */
        @keyframes wobble-stop {
            0% { transform: scale(0.3) rotate(-20deg); }
            20% { transform: scale(1.1) rotate(15deg); }
            40% { transform: scale(0.9) rotate(-10deg); }
            60% { transform: scale(1.05) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .draw-card { 
            background: white; width: 85%; max-width: 300px; padding: 25px; 
            border-radius: 35px; border: 6px solid var(--dark); text-align: center;
        }
        .draw-card.animate { animation: wobble-stop 0.6s ease-out forwards; }

        .amt-display { font-size: 4rem; font-weight: 900; color: var(--pink); margin: 10px 0; text-shadow: 3px 3px var(--yellow); }
        .btn-confirm { width: 100%; padding: 15px; background: var(--green); border: 4px solid var(--dark); border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 4px 4px 0px var(--dark); font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>365天存錢大挑戰</h1>
    
    <div class="milestones">
        <span class="badge" id="m10">🥉</span>
        <span class="badge" id="m50">🥈</span>
        <span class="badge" id="m100">🥇</span>
        <span class="badge" id="m200">💎</span>
        <span class="badge" id="m365">👑</span>
    </div>

    <div class="config-card">
        <div class="input-row"><label>🎈願望:</label><input type="text" id="wishText" placeholder="寫下目標..." oninput="saveSettings()"></div>
        <div class="input-row"><label>💰金額:</label><input type="number" id="targetAmt" placeholder="總金額目標" oninput="saveSettings()"></div>
    </div>

    <div class="progress-section">
        <div class="stats">
            <span>累積: $<span id="currentTotal">0</span></span>
            <span id="dayCount">0/365</span>
        </div>
        <div class="bar-container">
            <div class="bar-fill" id="progressBar"></div>
            <div class="percent-label" id="progressPercent">0%</div>
        </div>
    </div>

    <div class="grid" id="gridContainer">
        </div>

    <div class="reset-container">
        <button class="btn-reset" onclick="resetPlan()">🔄 重啟計畫案</button>
    </div>
</div>

<div id="modal">
    <div class="draw-card" id="cardElement">
        <div style="font-size: 1.1rem; font-weight: bold; color: var(--purple);">✨ 今日抽中金額 ✨</div>
        <div id="modalAmt" class="amt-display">$0</div>
        <div id="modalQuote" style="font-size:0.9rem; margin-bottom:15px; font-style:italic; color:#555;"></div>
        <div id="modalTip" style="font-size:0.8rem; color:#333; background:#FFF9C4; padding:8px; border-radius:15px; border: 2px dashed var(--pink); margin-bottom:20px;"></div>
        <button class="btn-confirm" onclick="confirmDraw()">存入錢包紀錄！</button>
    </div>
</div>

<audio id="soundPop" preload="auto" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>
<audio id="soundSuccess" preload="auto" src="https://assets.mixkit.co/active_storage/sfx/2017/2017-preview.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

<script>
    const COLORS = ['#FF6AD5', '#FFEA00', '#00E5FF', '#9262FF', '#69FFB4', '#FF9A3C'];
    const QUOTES = ["累積是強大的力量！", "離目標又近了一步！", "今天也很努力呢！", "好運正朝你走來！", "小錢成就大夢想！"];
    const TIPS = ["喝杯咖啡獎勵自己", "穿件喜歡的衣服", "清理一下書桌", "跟身邊的人說謝謝", "聽一首輕快的歌"];
    
    let state = { total: 0, count: 0, history: {} };
    let activeDay = null, activeAmt = 0;

    // 1. 先生成格子 (最重要的步驟)
    function buildGrid() {
        const grid = document.getElementById('gridContainer');
        if (!grid) return;
        grid.innerHTML = '';
        
        // 從本地讀取紀錄
        try {
            const savedData = localStorage.getItem('save365_vFinal');
            state.history = savedData ? JSON.parse(savedData) : {};
        } catch(e) { state.history = {}; }

        state.total = 0;
        state.count = 0;

        for (let i = 1; i <= 365; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = `cell-${i}`;
            cell.innerText = i;
            
            if (state.history[i]) {
                const data = state.history[i];
                cell.classList.add('done');
                cell.style.backgroundColor = data.color;
                cell.innerText = `$${data.amt}`;
                state.total += data.amt;
                state.count++;
            } else {
                cell.onclick = () => openModal(i);
            }
            grid.appendChild(cell);
        }
    }

    // 2. 初始化其他 UI 資訊
    function init() {
        buildGrid();
        document.getElementById('wishText').value = localStorage.getItem('save365_wish') || "";
        document.getElementById('targetAmt').value = localStorage.getItem('save365_target') || "";
        updateUI();
        checkBadges(false);
    }

    function openModal(day) {
        activeDay = day;
        activeAmt = Math.floor(Math.random() * 50) + 1;
        document.getElementById('modalAmt').innerText = `$${activeAmt}`;
        document.getElementById('modalQuote').innerText = `"${QUOTES[Math.floor(Math.random()*QUOTES.length)]}"`;
        document.getElementById('modalTip').innerText = `💡 開運貼士：${TIPS[Math.floor(Math.random()*TIPS.length)]}`;
        
        const modal = document.getElementById('modal');
        const card = document.getElementById('cardElement');
        
        modal.style.display = 'flex';
        card.classList.remove('animate');
        void card.offsetWidth; // 強制重繪
        card.classList.add('animate');
        
        const s = document.getElementById('soundPop');
        if(s) s.play().catch(()=>{});
    }

    function confirmDraw() {
        const col = COLORS[Math.floor(Math.random()*COLORS.length)];
        state.history[activeDay] = { amt: activeAmt, color: col };
        localStorage.setItem('save365_vFinal', JSON.stringify(state.history));
        
        state.total += activeAmt;
        state.count++;
        
        const el = document.getElementById(`cell-${activeDay}`);
        el.classList.add('done');
        el.style.backgroundColor = col;
        el.innerText = `$${activeAmt}`;
        el.onclick = null;

        updateUI();
        checkBadges(true);
        
        const s = document.getElementById('soundSuccess');
        if(s) s.play().catch(()=>{});
        
        document.getElementById('modal').style.display = 'none';
    }

    function updateUI() {
        const targetInput = document.getElementById('targetAmt').value;
        const totalSaved = state.total;
        const completedDays = state.count;

        let percent = (targetInput > 0) ? 
            Math.min(Math.round((totalSaved / targetInput) * 100), 100) : 
            Math.min(Math.round((completedDays / 365) * 100), 100);
        
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('progressPercent').innerText = percent + '%';
        document.getElementById('currentTotal').innerText = totalSaved;
        document.getElementById('dayCount').innerText = `${completedDays}/365`;
    }

    function checkBadges(shouldCelebrate) {
        const milestones = [10, 50, 100, 200, 365];
        const badgeIds = ['m10', 'm50', 'm100', 'm200', 'm365'];
        milestones.forEach((m, idx) => {
            const badge = document.getElementById(badgeIds[idx]);
            if (state.count >= m) {
                if (!badge.classList.contains('active')) {
                    badge.classList.add('active');
                    if (shouldCelebrate && typeof confetti === 'function') {
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                    }
                }
            } else { badge.classList.remove('active'); }
        });
    }

    function saveSettings() {
        localStorage.setItem('save365_wish', document.getElementById('wishText').value);
        localStorage.setItem('save365_target', document.getElementById('targetAmt').value);
        updateUI();
    }

    function resetPlan() {
        if (confirm("⚠️ 注意！確定要重啟嗎？這會清除所有紀錄。")) {
            localStorage.removeItem('save365_vFinal');
            init();
        }
    }

    // 啟動程式
    window.onload = init;
</script>
</body>
</html>
